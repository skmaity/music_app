plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Optional Play Store signing credentials, kept out of the repo.
//
// `android/key.properties` is gitignored and holds the keystore password, the
// key password, the alias and the path to the .jks. See key.properties.example
// for the shape of it and README-release.md for how to generate the keystore.
//
// Direct APK releases keep the existing debug certificate so users can install
// updates over the APK already shared from this project. Switch the build type
// below to `signingConfigs.release` before the first Play Store distribution.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // Not changed alongside applicationId on purpose. `namespace` is the
    // package the generated R and BuildConfig classes live in and it matches
    // the Kotlin source tree under src/main/kotlin/com/shubha/music/; moving
    // it would mean moving MainActivity.kt and its package declaration for no
    // user-visible gain. `applicationId` is the id that is permanent on the
    // Play Store, and that one is the brand's.
    namespace = "com.shubha.music"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // Permanent once published: this is the id in the Play Store URL and
        // the key Google uses to identify the app forever. Set to the brand
        // before the first upload, which was the only free moment to do it.
        applicationId = "com.nyro.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Direct sharing only: keep the same certificate as earlier APKs.
            signingConfig = signingConfigs.debug


            // minifyEnabled/shrinkResources are not set here — but do NOT read
            // that as "release builds are not shrunk". They are.
            //
            // Flutter's own Gradle plugin forces both on for this build type:
            // FlutterPlugin.kt's `shouldShrinkResources` branch sets
            // `isMinifyEnabled = true` and `isShrinkResources = true` on
            // `release`, and adds proguard-android-optimize.txt plus Flutter's
            // own keep rules. Leaving them unset here changes nothing.
            //
            // The consequence to remember: anything reachable only from Dart is
            // invisible to the shrinker. R8's "safe" mode finds resource names
            // in Java/Kotlin string constants, but a name that lives in the AOT
            // snapshot in libapp.so does not exist as far as it is concerned.
            // That stripped drawable/ic_stat_nyro — named only by
            // JustAudioBackground.init in lib/main.dart — and killed the app on
            // the first track played, in release builds only. See
            // src/main/res/raw/keep.xml; new Dart-named resources go in there.
            //
            // To opt out instead, set `minifyEnabled false` and
            // `shrinkResources false` explicitly — unset does not mean off.
        }
    }
}

flutter {
    source = "../.."
}
