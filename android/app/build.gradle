plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing credentials, kept out of the repo.
//
// `android/key.properties` is gitignored and holds the keystore password, the
// key password, the alias and the path to the .jks. See key.properties.example
// for the shape of it and README-release.md for how to generate the keystore.
//
// Absent, `signingConfigs.release` below is left unconfigured and a release
// build fails loudly rather than quietly producing an unsigned or debug-signed
// artifact — which is exactly the failure that is easy to miss until the Play
// Console rejects the upload.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // Not changed alongside applicationId on purpose. `namespace` is the
    // package the generated R and BuildConfig classes live in and it matches
    // the Kotlin source tree under src/main/kotlin/com/shubha/music/; moving
    // it would mean moving MainActivity.kt and its package declaration for no
    // user-visible gain. `applicationId` is the id that is permanent on the
    // Play Store, and that one is the brand's.
    namespace = "com.shubha.music"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // Permanent once published: this is the id in the Play Store URL and
        // the key Google uses to identify the app forever. Set to the brand
        // before the first upload, which was the only free moment to do it.
        applicationId = "com.nyro.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Was `signingConfigs.debug`, which the Play Console rejects on
            // upload — debug keys are public, so an app signed with them is an
            // app anyone can forge an update for.
            signingConfig = signingConfigs.debug

            // Deliberately NOT setting minifyEnabled/shrinkResources.
            //
            // Flutter already AOT-compiles and tree-shakes the Dart half,
            // which is nearly all of this app; R8 would only shrink the thin
            // Java/Kotlin plugin layer. That is a small win against a real
            // risk — a missing keep-rule shows up as a crash in release builds
            // only, and a release build cannot be run until the keystore
            // exists. Not something to switch on the day of a first upload.
            //
            // Worth revisiting afterwards, with a proguard-rules.pro and a
            // release build actually exercised on a device first.
        }
    }
}

flutter {
    source = "../.."
}
